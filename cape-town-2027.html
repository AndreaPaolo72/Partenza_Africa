<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partenza per Cape Town 27/02/2027 - 10:00</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hero{text-align:center;width:100%;max-width:760px}h1{font-size:clamp(1.4rem,5vw,2.3rem);line-height:1.25;margin:0 0 12px}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:24px}.tile{background:#111827;border-radius:12px;padding:16px 6px}.num{font-size:clamp(1.5rem,7vw,3rem);font-weight:800;font-variant-numeric:tabular-nums}.label{font-size:clamp(.65rem,2vw,.85rem);text-transform:uppercase;color:#9ca3af;margin-top:6px}.when{margin-top:20px;color:#aab4c4;font-size:clamp(.9rem,3vw,1.05rem)}@media(max-width:350px){.timer{gap:5px}.tile{padding:12px 3px}}
</style>
</head>
<body><main class="hero">
<h1>Partenza per Cape Town<br>27/02/2027 - 10:00</h1>
<div class="timer" aria-label="Tempo rimanente alla partenza">
<div class="tile"><div class="num" id="days">—</div><div class="label">Giorni</div></div>
<div class="tile"><div class="num" id="hours">—</div><div class="label">Ore</div></div>
<div class="tile"><div class="num" id="minutes">—</div><div class="label">Minuti</div></div>
<div class="tile"><div class="num" id="seconds">—</div><div class="label">Secondi</div></div>
</div><div class="when" id="when">Sabato 27 febbraio 2027, ore 10:00 (Italia)</div>
</main><script>
const target=Date.parse("2027-02-27T10:00:00+01:00");
const pad=n=>String(n).padStart(2,"0");
function update(){
const remaining=Math.max(0,Math.floor((target-Date.now())/1000));
const days=Math.floor(remaining/86400),hours=Math.floor(remaining%86400/3600),minutes=Math.floor(remaining%3600/60),seconds=remaining%60;
document.getElementById("days").textContent=days;
document.getElementById("hours").textContent=pad(hours);
document.getElementById("minutes").textContent=pad(minutes);
document.getElementById("seconds").textContent=pad(seconds);
if(remaining===0)document.getElementById("when").textContent="È arrivato il momento della partenza!";
document.title="Partenza per Cape Town — "+days+"g "+pad(hours)+":"+pad(minutes)+":"+pad(seconds);
}
update();setInterval(update,1000);
</script></body></html>
